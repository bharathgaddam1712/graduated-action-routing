name: CPU Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: page2027_confirmatory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: page2027_confirmatory/requirements-analysis.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-analysis.txt scikit-learn==1.6.1 rank-bm25==0.2.2
      - name: Verify routing, statistics, and mock workflow
        run: python -m unittest discover -s tests -v
